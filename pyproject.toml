[project]
name = "agent-handoff-tools-workspace"
version = "0.0.0"
description = "Development workspace for agent-packet and agent-receipt"
requires-python = ">=3.10"
dependencies = []

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "pytest>=8,<10",
  "ruff>=0.12,<1",
  "twine>=6,<7",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/agent-packet", "packages/agent-receipt"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "RUF"]
ignore = [
  "S101", # assert is expected in tests
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S603", "S607"]
"packages/*/tests/**" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["agent_packet", "agent_receipt"]
