[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-packet"
version = "0.1.0"
description = "Allowlist-based task packets for Hermes, OpenClaw, and other AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Maurice Mohr"}]
keywords = ["ai-agents", "hermes", "openclaw", "sanitization", "security"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Security"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.6"]

[project.scripts]
agent-packet = "agent_packet.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/agent_packet/secrets.py" = ["UP"]

[tool.ruff.lint.isort]
known-first-party = ["agent_packet"]
