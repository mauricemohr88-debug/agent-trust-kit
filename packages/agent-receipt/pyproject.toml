[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-receipt"
version = "0.1.1"
description = "Offline, bounded claim-to-evidence receipts for agent handoffs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Maurice Mohr"}]
keywords = ["ai-agents", "hermes", "openclaw", "verification", "receipts"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]
dependencies = ["cryptography>=42"]

[project.urls]
Homepage = "https://github.com/mauricemohr88-debug/agent-trust-kit"
Documentation = "https://github.com/mauricemohr88-debug/agent-trust-kit/blob/main/packages/agent-receipt/README.md"
Issues = "https://github.com/mauricemohr88-debug/agent-trust-kit/issues"
Repository = "https://github.com/mauricemohr88-debug/agent-trust-kit"

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.9"]

[project.scripts]
agent-receipt = "agent_receipt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["agent_receipt"]
