name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Install Python
        run: uv python install "${{ matrix.python-version }}"

      - name: Sync workspace
        run: uv sync --all-packages --group dev --python "${{ matrix.python-version }}" --locked

      - name: Test
        run: uv run --python "${{ matrix.python-version }}" pytest -q

      - name: Lint
        if: matrix.python-version == '3.11'
        run: uv run ruff check --config pyproject.toml .

      - name: Format
        if: matrix.python-version == '3.11'
        run: uv run ruff format --config pyproject.toml --check .

  packages:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.1"
          enable-cache: true

      - name: Build packages
        run: |
          uv build packages/agent-packet --out-dir dist/agent-packet
          uv build packages/agent-receipt --out-dir dist/agent-receipt

      - name: Check package metadata
        run: uvx --from twine==6.2.0 twine check dist/*/*

      - name: Install and import built wheels
        run: |
          uv venv .package-smoke
          uv pip install --python .package-smoke/bin/python \
            dist/agent-packet/*.whl dist/agent-receipt/*.whl
          .package-smoke/bin/agent-packet --version
          .package-smoke/bin/agent-receipt --version
